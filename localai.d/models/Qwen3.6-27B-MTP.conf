# vim:set ts=8 sts=2 sw=2 tw=0 et ft=sh:

user="unsloth"
model="Qwen3.6-27B-MTP-GGUF"
quant="UD-IQ2_M"
#quant="UD-IQ3_XXS"

args=(
  # See: https://unsloth.ai/docs/models/qwen3.6
  --temp 0.6 
  --top-p 0.95 
  --top-k 20 
  --presence-penalty 0.0
  --min-p 0.00

  # Reasoning
  --reasoning on
  --reasoning-preserve

  # Model loading
  --no-mmap

  # Prefill
  --flash-attn on
  -ctk q8_0 -ctv q8_0

  # Decoder
  --spec-type draft-mtp
  --spec-draft-n-max 2
)
